name: Build desktop packages

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-13
            script: dist:mac
            artifact: release/SeerMarkdown-*-mac-*.dmg
          - platform: Windows
            os: windows-latest
            script: dist:win
            artifact: release/SeerMarkdown-*-win-*.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build renderer and Electron bundles
        run: npm run build

      - name: Build ${{ matrix.platform }} package
        run: npm run ${{ matrix.script }}

      - name: Upload ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeerMarkdown-${{ matrix.platform }}-${{ github.run_id }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
